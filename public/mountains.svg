<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800">
  <!-- 占位画《云山》：拿到 Midjourney 真图后换成 mountains.jpg -->
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede2c8"/>
      <stop offset=".45" stop-color="#e0dcc8"/>
      <stop offset="1" stop-color="#ede2c8"/>
    </linearGradient>
    <radialGradient id="melt2" cx=".5" cy=".5" r=".72">
      <stop offset=".58" stop-color="#ede2c8" stop-opacity="0"/>
      <stop offset="1" stop-color="#ede2c8"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1800" fill="url(#sky2)"/>

  <!-- 群鸟 -->
  <g stroke="#241c15" stroke-width="3" fill="none" opacity=".5">
    <path d="M300 360 q14 -14 28 0 M328 360 q14 -14 28 0"/>
    <path d="M420 320 q12 -12 24 0 M444 320 q12 -12 24 0"/>
    <path d="M250 430 q10 -10 20 0 M270 430 q10 -10 20 0"/>
  </g>

  <!-- 高峰群（石青，层叠） -->
  <path d="M180 1080 Q330 420 480 1020 L480 1200 L180 1200 Z" fill="#3d6b96" opacity=".72"/>
  <path d="M420 1100 Q590 300 780 1060 L780 1240 L420 1240 Z" fill="#345a7e" opacity=".85"/>
  <path d="M720 1120 Q860 520 1020 1080 L1020 1260 L720 1260 Z" fill="#3d6b96" opacity=".6"/>
  <path d="M60 1140 Q160 700 300 1120 L300 1260 L60 1260 Z" fill="#7f9db4" opacity=".45"/>

  <!-- 石绿近峰 -->
  <path d="M540 1180 Q660 760 820 1160 L820 1320 L540 1320 Z" fill="#5a8a6e" opacity=".55"/>

  <!-- 山腰小亭（朱砂顶） -->
  <g transform="translate(596,905)">
    <path d="M-34 0 L0 -26 L34 0 Z" fill="#9c3324"/>
    <rect x="-22" y="0" width="44" height="26" fill="#241c15" opacity=".8"/>
    <rect x="-26" y="26" width="52" height="5" fill="#241c15"/>
  </g>

  <!-- 松（简笔） -->
  <g fill="#241c15" opacity=".75">
    <rect x="838" y="1075" width="5" height="46"/>
    <path d="M818 1082 Q841 1044 864 1082 Z"/>
    <path d="M823 1062 Q841 1032 859 1062 Z"/>
  </g>

  <!-- 云海（纸色波浪带） -->
  <path d="M0 1240 Q150 1190 300 1240 Q450 1290 600 1240 Q750 1190 900 1240 Q1050 1290 1200 1240 L1200 1420 L0 1420 Z" fill="#ede2c8" opacity=".9"/>
  <path d="M0 1330 Q200 1285 400 1330 Q600 1375 800 1330 Q1000 1285 1200 1330 L1200 1500 L0 1500 Z" fill="#ede2c8" opacity=".75"/>
  <ellipse cx="320" cy="1250" rx="300" ry="55" fill="#ede2c8" opacity=".7"/>
  <ellipse cx="900" cy="1275" rx="330" ry="60" fill="#ede2c8" opacity=".65"/>

  <!-- 云海之下的淡山影 -->
  <path d="M200 1560 Q320 1470 460 1560 Z" fill="#7f9db4" opacity=".3"/>
  <path d="M640 1590 Q780 1480 930 1590 Z" fill="#7f9db4" opacity=".25"/>

  <!-- 朱砂印章 -->
  <g transform="translate(120,1560) rotate(-5)">
    <rect width="64" height="64" rx="6" fill="#9c3324"/>
    <text x="32" y="47" font-family="Songti SC, Noto Serif SC, serif" font-size="40" fill="#ede2c8" text-anchor="middle">雲</text>
  </g>

  <!-- 边缘融入纸面 -->
  <rect width="1200" height="1800" fill="url(#melt2)"/>
</svg>
